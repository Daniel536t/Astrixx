[package]
name = "astrix-world"
version = "0.1.0"
description = "ASTrix authoritative tree-chop and farm-construction state for MagicBlock Ephemeral Rollups"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "astrix_world"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []

[dependencies]
anchor-lang = "=1.0.2"
ephemeral-rollups-sdk = { version = "=0.17.3", features = ["anchor"] }
